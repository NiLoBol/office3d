<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WRIS Office 3D v2 — เดินในออฟฟิศ</title>
<style>
  :root{--bg:#0a1017;--panel:rgba(14,24,34,.82);--line:rgba(150,190,220,.18);--txt:#e9f2f9;--dim:#8ea5b8;--acc:#5ec8ff;--gold:#ffc657}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1017;color:var(--txt);
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#0a1017}
  #hud{position:fixed;inset:0;pointer-events:none}
  #top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:linear-gradient(180deg,rgba(5,10,16,.82),rgba(5,10,16,0));}
  #top b{font-size:13.5px;letter-spacing:.2px}
  #top b em{font-style:normal;color:var(--acc)}
  #stats{margin-left:auto;color:var(--dim);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
  .btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:11px;
    min-height:40px;padding:0 12px;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:6px;
    backdrop-filter:blur(8px);cursor:pointer}
  .btn.on{border-color:var(--acc);color:var(--acc)}
  .btn:active{transform:scale(.97)}
  #bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:7px;flex-wrap:nowrap;align-items:center}
  #lights{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #lights::-webkit-scrollbar{display:none}
  .chip{pointer-events:auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 10px;
    min-height:34px;font:inherit;font-size:11px;color:var(--dim);display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(8px)}
  .chip.on{color:#ffe9c9;border-color:rgba(255,214,140,.5);background:rgba(60,44,20,.55)}
  #go{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:11px;
    min-height:34px;padding:0 8px;font:inherit;font-size:11px;backdrop-filter:blur(8px);max-width:118px;flex:none}
  #mrow{position:absolute;left:10px;right:10px;bottom:52px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
    flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;pointer-events:auto}
  #mrow::-webkit-scrollbar{display:none}
  .mchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
    background:rgba(12,22,32,.82);backdrop-filter:blur(8px);padding:0 10px;min-height:32px;font:inherit;font-size:10.5px;
    color:#cfe0ee;cursor:pointer}
  .mchip i{width:8px;height:8px;border-radius:50%;background:#2fd06a;flex:none}
  .mchip.busy i{background:#ff5a4a}
  .mchip.soon i{background:#ffc657}
  .mchip b{font-weight:650;color:#eaf4fb}
  #room{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:12px;color:#cfe6f6;
    background:rgba(9,17,26,.62);border:1px solid var(--line);border-radius:999px;padding:4px 12px;opacity:0;transition:.2s}
  #room.show{opacity:1}
  #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.35);display:none}
  #cross.hot{border-color:var(--acc);box-shadow:0 0 8px rgba(94,200,255,.6)}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;color:#9db3c7;font-size:10.5px;
    background:rgba(9,17,26,.6);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
  #err{position:absolute;left:12px;right:12px;top:52px;background:rgba(60,18,18,.9);border:1px solid #a2493f;color:#ffd9d4;
    border-radius:10px;padding:8px 10px;font-size:11.5px;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto}
  #load{position:absolute;inset:0;display:grid;place-items:center;background:#0a1017;color:var(--dim);font-size:12px;transition:.4s}
  #load.gone{opacity:0;pointer-events:none}
</style>
<script src="vendor/three.min.js"></script>
<script src="plan2.js"></script>
<script src="lib2/util.js"></script>
<script src="lib2/materials.js"></script>
<script src="lib2/signals.js"></script>
<script src="lib2/status.js"></script>
<script src="lib2/assemble.js"></script>
<script>window.__mods = {};</script>
<script src="lib2/structure.js" onerror="__mods.structure='missing'"></script>
<script src="lib2/doors.js" onerror="__mods.doors='missing'"></script>
<script src="lib2/furniture-work.js" onerror="__mods.work='missing'"></script>
<script src="lib2/furniture-meeting.js" onerror="__mods.meeting='missing'"></script>
<script src="lib2/furniture-lounge.js" onerror="__mods.lounge='missing'"></script>
<script src="lib2/parking.js" onerror="__mods.parking='missing'"></script>
<script src="lib2/people.js" onerror="__mods.people='missing'"></script>
<script src="lib2/lighting.js" onerror="__mods.lighting='missing'"></script>
<script src="lib2/walk.js" onerror="__mods.walk='missing'"></script>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="top">
    <b>WRIS <em>Office 3D</em> v2</b>
    <div id="stats">—</div>
    <button class="btn" id="bMode">🚶 เดิน</button>
    <button class="btn" id="bNight">☀</button>
  </div>
  <div id="room"></div>
  <div id="err"></div>
  <div id="cross"></div>
  <div id="mrow"></div>
  <div id="bar"><div id="lights"></div></div>
  <div id="hint">ลากซ้าย = เดิน · ลากขวา = มอง · วนซ้าย/ขวาแบบภาพรวม</div>
  <div id="load">กำลังประกอบฉาก…</div>
</div>
<script>
(function () {
  var plan = window.OFFICE2, O = window.O3D2, THREE = window.THREE;
  var errBox = document.getElementById('err');
  function fail(msg) { errBox.style.display = 'block'; errBox.textContent += msg + '\n'; console.warn(msg); }
  window.addEventListener('error', function (e) { fail('⚠ ' + (e.message || e.error)); });

  var canvas = document.getElementById('cv');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { fail('WebGL ใช้ไม่ได้: ' + e.message); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1620);
  var camera = new THREE.PerspectiveCamera(72, 1, 0.05, 140);
  camera.position.set(-8, 12, 26);

  /* ── ประกอบฉาก ─────────────────────────────────────────── */
  /* ต่อกับระบบบริษัทได้ทาง query: ?api=https://host&token=XXX (เว้นว่าง = โหมดเดโม) */
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('api')) { plan.api = plan.api || {}; plan.api.base = qs.get('api'); plan.api.token = qs.get('token') || ''; }
  } catch (e) { }
  var ctx = { THREE: THREE, plan: plan, mats: O.mats, util: O.util, renderer: renderer, scene: scene };
  var A = O.assemble(ctx);
  var colliders = A.colliders, groups = A.groups, shellTop = A.shellTop, L = A.lighting;
  A.problems.forEach(fail);
  function showShell(on) { shellTop.forEach(function (o) { o.visible = on; }); }
  showShell(false);
  if (!L) { /* กันไว้ถ้าโมดูลแสงยังไม่มา */
    var hemi = new THREE.HemisphereLight(0xdfeaff, 0x4a4237, 1.1); scene.add(hemi);
    var sun = new THREE.DirectionalLight(0xfff2dc, 1.6); sun.position.set(-18, 26, -12); scene.add(sun);
  }

  /* ── กล้องภาพรวม (orbit เอง, ไม่ใช้ lib) ───────────────── */
  var target = new THREE.Vector3(17, 1.2, 11), sph = { r: 42, th: 0.9, ph: 0.95 };
  function applyOrbit() {
    camera.position.set(
      target.x + sph.r * Math.sin(sph.ph) * Math.sin(sph.th),
      target.y + sph.r * Math.cos(sph.ph),
      target.z + sph.r * Math.sin(sph.ph) * Math.cos(sph.th));
    camera.lookAt(target);
  }
  function clampOrbit() {
    sph.r = Math.max(4, Math.min(70, sph.r));
    sph.ph = Math.max(0.12, Math.min(1.5, sph.ph));
  }
  applyOrbit();

  /* ── โหมดเดิน ──────────────────────────────────────────── */
  var walk = null, mode = 'orbit', roomEl = document.getElementById('room'), crossEl = document.getElementById('cross'),
      hintEl = document.getElementById('hint');
  if (O.walk) {
    try {
      walk = O.walk.create({ THREE: THREE, camera: camera, canvas: canvas, colliders: colliders, spawn: plan.spawn, scene: scene });
      if (walk.onRoom) walk.onRoom(function (sp) {
        if (!sp) { roomEl.classList.remove('show'); return; }
        var txt = sp.label;
        if (SIG && sp.furn === 'meeting') {
          var st = SIG.get('/meeting/' + sp.id + '/state');
          txt += st === 'busy'
            ? ' · ไม่ว่าง · ' + (SIG.get('/meeting/' + sp.id + '/who') || '—') + ' ถึง ' + (SIG.get('/meeting/' + sp.id + '/until') || '-')
            : ' · ว่าง';
        }
        roomEl.textContent = txt; roomEl.classList.add('show');
      });
      if (walk.onInteract) walk.onInteract(function (obj) { if (obj && obj.userData && obj.userData.path) toast(obj.userData.path); });
    } catch (e) { fail('โหมดเดินพัง: ' + e.message); walk = null; }
  }
  function toast(t) { roomEl.textContent = t; roomEl.classList.add('show'); setTimeout(function () { roomEl.classList.remove('show'); }, 1600); }

  var bMode = document.getElementById('bMode'), bNight = document.getElementById('bNight');
  function setMode(m) {
    mode = m;
    if (!walk) { toast('โหมดเดินยังไม่พร้อม'); return; }
    if (m === 'walk') { showShell(true); walk.enable(); bMode.classList.add('on'); bMode.textContent = '🗺 ภาพรวม'; crossEl.style.display = 'block'; if (hintEl) hintEl.style.display = 'none'; }
    else { walk.disable(); showShell(false); bMode.classList.remove('on'); bMode.textContent = '🚶 เดิน'; crossEl.style.display = 'none'; if (hintEl) hintEl.style.display = ''; applyOrbit(); roomEl.classList.remove('show'); }
  }
  bMode.onclick = function () { setMode(mode === 'walk' ? 'orbit' : 'walk'); };
  /* เปิดมา = โหมดเดินในโถง (เข้าไปดูออฟฟิศได้เลย) */
  if (walk) setMode('walk');

  /* ── กลางวัน/กลางคืน ──────────────────────────────────── */
  var night = false;
  function setNight(n) {
    night = n;
    bNight.textContent = n ? '🌙' : '☀';
    bNight.classList.toggle('on', n);
    if (L && L.hooks && L.hooks.setNight) L.hooks.setNight(n);
    else renderer.toneMappingExposure = n ? 1.25 : 1.05;
  }
  bNight.onclick = function () { setNight(!night); };

  /* ── ไฟรายห้อง: อ่าน/เขียน path /lights/<room> ผ่านชั้นสัญญาณ ──────── */
  var SIG = A.signals, lightsEl = document.getElementById('lights'), chipOf = {};
  function applyLight(id, on) {
    if (L && L.hooks && L.hooks.setSpaceLight) L.hooks.setSpaceLight(id, on);
    if (chipOf[id]) chipOf[id].classList.toggle('on', !!on);
  }
  plan.rooms.concat([plan.corridor]).forEach(function (sp) {
    var path = (sp.bind && sp.bind.light) || ('/lights/' + sp.id);
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.innerHTML = '💡 ' + sp.label;
    chip.onclick = function () {
      var cur = SIG ? SIG.get(path) : true;
      if (SIG) SIG.push(path, !cur); else applyLight(sp.id, !cur);
    };
    chipOf[sp.id] = chip;
    lightsEl.appendChild(chip);
    if (SIG) SIG.subscribe(function (p, v) { if (p === path) applyLight(sp.id, v !== false); }, true);
  });

  /* ── ไปห้อง (teleport ในโหมดเดิน) ──────────────────────── */
  var allSpaces = plan.rooms.concat([plan.corridor]);
  function gotoRoom(sp) {
    if (!sp) return;
    var x = sp.x + sp.w / 2, z = sp.z + sp.d / 2, yaw = 0;
    var d = sp.door;
    if (d) {
      if (d.side === 'z1') { z = sp.z + sp.d - 1.1; x = sp.x + d.at; yaw = 0; }
      else if (d.side === 'z0') { z = sp.z + 1.1; x = sp.x + d.at; yaw = Math.PI; }
      else if (d.side === 'x1') { x = sp.x + sp.w - 1.1; z = sp.z + d.at; yaw = Math.PI / 2; }
      else { x = sp.x + 1.1; z = sp.z + d.at; yaw = -Math.PI / 2; }
    }
    if (mode !== 'walk') setMode('walk');
    if (walk) walk.teleport(x, z, yaw);
  }
  var go = document.createElement('select');
  go.id = 'go';
  go.appendChild(new Option('ไปห้อง…', ''));
  allSpaces.forEach(function (sp) { go.appendChild(new Option(sp.label, sp.id)); });
  document.getElementById('bar').appendChild(go);
  go.onchange = function () {
    gotoRoom(allSpaces.filter(function (s) { return s.id === go.value; })[0]);
    go.value = '';
  };

  /* ── แถวสถานะห้องประชุม: ว่าง/ใครจอง/ถึงกี่โมง/กี่คน ───────── */
  function paintM(sp) {
    var c = mChip[sp.id]; if (!c) return;
    var st = SIG ? SIG.get('/meeting/' + sp.id + '/state') : 'free';
    var who = SIG ? (SIG.get('/meeting/' + sp.id + '/who') || '') : '';
    var until = SIG ? (SIG.get('/meeting/' + sp.id + '/until') || '') : '';
    var n = SIG ? (SIG.get('/meeting/' + sp.id + '/count') || 0) : 0;
    c.className = 'mchip' + (st === 'busy' ? ' busy' : (st === 'soon' ? ' soon' : ''));
    c.innerHTML = '<i></i><b>' + sp.label + '</b><span>' +
      (st === 'busy' ? (who || 'จองแล้ว') + ' · ถึง ' + (until || '-') + ' · ' + n + ' คน' : 'ว่าง') + '</span>';
  }
  var mRow = document.getElementById('mrow'), mChip = {};
  plan.rooms.filter(function (sp) { return sp.furn === 'meeting'; }).forEach(function (sp) {
    var c = document.createElement('button');
    c.className = 'mchip';
    c.onclick = function () { gotoRoom(sp); };
    mRow.appendChild(c); mChip[sp.id] = c;
    if (SIG) SIG.subscribe(function (p) { if (p.indexOf('/meeting/' + sp.id + '/') === 0) paintM(sp); });
    paintM(sp);
  });

  /* ── อินพุตภาพรวม: ลากหมุน · pinch/ล้อ ซูม ─────────────── */
  var drag = null, pinch = null;
  canvas.addEventListener('pointerdown', function (e) {
    if (mode !== 'orbit') return;
    drag = { x: e.clientX, y: e.clientY, th: sph.th, ph: sph.ph };
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || mode !== 'orbit') return;
    sph.th = drag.th - (e.clientX - drag.x) * 0.008;
    sph.ph = drag.ph - (e.clientY - drag.y) * 0.006;
    clampOrbit(); applyOrbit();
  });
  canvas.addEventListener('pointerup', function () { drag = null; });
  canvas.addEventListener('pointercancel', function () { drag = null; });
  canvas.addEventListener('wheel', function (e) { sph.r += e.deltaY * 0.03; clampOrbit(); applyOrbit(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    if (mode !== 'orbit') return;
    if (e.touches.length === 2) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) { sph.r -= (d - pinch) * 0.12; clampOrbit(); applyOrbit(); }
      pinch = d;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', function () { pinch = null; });

  /* ── รีไซส์ ───────────────────────────────────────────── */
  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    if (mode === 'orbit') applyOrbit();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ── ลูปเรนเดอร์ ──────────────────────────────────────── */
  var statsEl = document.getElementById('stats'), last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
    if (walk && mode === 'walk' && walk.update) { try { walk.update(dt); } catch (e) { fail('walk.update: ' + e.message); } }
    if (L && L.hooks && L.hooks.update) { try { L.hooks.update(dt); } catch (e) { } }
    if (A.built) for (var bi = 0; bi < A.built.length; bi++) {
      var bm = A.built[bi];
      if (bm && bm.hooks && bm.hooks.update) { try { bm.hooks.update(dt); } catch (e) { } }
    }
    renderer.render(scene, camera);
    var inf = renderer.info.render;
    statsEl.textContent = (fps > 0 ? fps + ' fps · ' : '') + (inf.triangles / 1000).toFixed(0) + 'k tri · ' + inf.calls + ' call';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(function () { document.getElementById('load').classList.add('gone'); }, 350);
  window.__office2 = { scene: scene, camera: camera, renderer: renderer, colliders: colliders, setMode: setMode, setNight: setNight, groups: groups, L: L, walk: walk };
})();
</script>
</html>
