<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WRIS Office 3D — บอร์ด 3D + ตัวต่อสัญญาณ</title>
<style>
  :root{--bg:#0b131d;--panel:#131f2c;--panel2:#182635;--line:#243546;--txt:#e8f1f8;--dim:#8aa0b4;--acc:#5ec8ff;--gold:#ffc657;--ok:#5fd68a;--bad:#ff7a72}
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#16273a 0%,#0b131d 62%);color:var(--txt);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:10px;padding:11px 14px 7px}
  h1{margin:0;font-size:18px;letter-spacing:.2px;font-weight:800}
  h1 em{font-style:normal;color:var(--acc)}
  #stat{margin-left:auto;color:var(--dim);font-size:11px;text-align:right;line-height:1.35}
  #stage{position:relative;margin:0 10px;border-radius:16px;overflow:hidden;background:#0e1826;
    box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 0 0 1px var(--line)}
  #cv{display:block;width:100%;height:52vh;min-height:320px;touch-action:none;cursor:grab}
  #cv:active{cursor:grabbing}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lb{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;
    font-size:11px;font-weight:650;color:#f2f7fb;background:rgba(11,19,29,.55);border:1px solid rgba(120,160,190,.22);
    padding:2px 7px;border-radius:8px;backdrop-filter:blur(3px)}
  #tools{position:absolute;right:9px;top:9px;display:flex;gap:6px}
  #tools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(19,31,44,.85);
    color:var(--txt);font-size:15px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
  #tools button.on{border-color:var(--acc);color:var(--acc)}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:#9db3c7;font-size:10.5px;
    pointer-events:none;background:rgba(11,19,29,.66);border:1px solid rgba(120,160,190,.18);border-radius:999px;padding:3px 10px}
  #toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-14px);opacity:0;transition:.22s;
    background:rgba(16,32,48,.94);border:1px solid var(--acc);color:#eaf6ff;font-size:11.5px;padding:6px 12px;
    border-radius:999px;pointer-events:none;max-width:80%;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #fallback{display:none;width:100%;height:52vh;min-height:320px;align-items:center;justify-content:center;padding:24px;
    color:#ffb0aa;font-size:13px;text-align:center;background:#101a26}
  #pop{position:absolute;left:9px;right:9px;bottom:9px;background:rgba(15,28,40,.96);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(0,0,0,.5)}
  #pop.hidden{display:none}
  .ph{display:flex;align-items:center;gap:8px}
  .ph b{font-size:13.5px}
  #popX{margin-left:auto;background:transparent;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 4px}
  .pd{margin-top:3px;color:#a8c0d4;font-size:11.5px;line-height:1.7}
  .pd code,.kv code{color:#9fe0ff;background:#0c1a26;border-radius:5px;padding:1px 5px;font-size:10.5px}
  .pa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pa button,.acts button{border:1px solid var(--line);background:#1b2c3d;color:#dceaf5;border-radius:9px;
    padding:6px 10px;font:inherit;font-size:11.5px;cursor:pointer}
  .pa button:active,.acts button:active{transform:scale(.97)}
  #sheet{padding:10px 12px 22px}
  .sect{display:flex;align-items:baseline;gap:8px;margin:2px 2px 7px}
  .sect h2{margin:0;font-size:13.5px;font-weight:750}
  .sect span{color:var(--dim);font-size:11px}
  #cards{display:flex;flex-direction:column;gap:8px}
  .card{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:9px 10px}
  .card.off{opacity:.5}
  .ico{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .mid{flex:1;min-width:0}
  .nm{font-weight:700;font-size:12.5px}
  .badge{font-size:9.5px;font-weight:600;color:#9fb6c9;background:#0e1a26;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:4px}
  .st{color:var(--ok);font-size:11.5px;margin-top:1px}
  .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .sw{position:relative;flex:none;width:38px;height:22px}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw span{position:absolute;inset:0;border-radius:999px;background:#2a3a4a;transition:.18s;pointer-events:none}
  .sw span:after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#8fa3b5;transition:.18s}
  .sw input:checked + span{background:#173d52}
  .sw input:checked + span:after{left:18px;background:var(--acc)}
  .api{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px}
  .api .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .api .hd b{font-size:12.5px}
  .api .hd .badge{margin-left:0}
  #copy{margin-left:auto;background:#1b2c3d;border:1px solid var(--line);color:#cfe3f3;border-radius:8px;
    padding:4px 8px;font:inherit;font-size:10.5px;cursor:pointer}
  .row{display:flex;gap:6px}
  .row input[type=text]{background:#0d1a25;border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:8px 9px;font:inherit;font-size:12px;min-width:0}
  #path{flex:1 1 52%}
  #val{flex:0 1 30%}
  #send{flex:none;background:#173d52;border:1px solid var(--acc);color:#dff4ff;border-radius:9px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
  #log{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .lg{display:flex;gap:7px;align-items:baseline;font-size:10.5px;color:#9fb6c9;border-top:1px dashed #1d2b3a;padding-top:4px}
  .lg .t{color:#6d8497;flex:none}
  .lg code{color:#9fe0ff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg .v{color:var(--gold);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg.empty{color:#6d8497;border-top:0}
  footer{color:#66798c;font-size:10.5px;text-align:center;padding:14px 16px 22px;line-height:1.6}
</style>

<body>
<header>
  <h1>WRIS <em>Office 3D</em></h1>
  <div id="stat">…</div>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="fallback"></div>
  <div id="labels"></div>
  <div id="tools">
    <button id="btnReset" title="จัดมุมใหม่">⤾</button>
    <button id="btnLabels" class="on" title="ชื่อห้อง">🏷</button>
    <button id="btnSim" title="จำลองผู้ส่งข้อมูล">▶</button>
  </div>
  <div id="hint">ลาก = หมุน · สองนิ้ว = ซูม · แตะ = เลือก/สั่งงาน</div>
  <div id="toast"></div>
  <div id="pop" class="hidden">
    <div class="ph"><b id="popT">—</b><button id="popX">✕</button></div>
    <div id="popD" class="pd"></div>
    <div id="popA" class="pa"></div>
  </div>
</div>

<div id="sheet">
  <div class="sect"><h2>ตัวต่อที่ต่ออยู่</h2><span>สลับ = ถอด/ต่อโมดูล</span></div>
  <div id="cards"></div>

  <div class="api">
    <div class="hd"><b>API / MCP — ส่งสัญญาณเข้า</b><span class="badge">demo</span>
      <button id="copy">คัดลอก state</button></div>
    <div class="row">
      <input type="text" id="path" value="/lights/sales" autocomplete="off" spellcheck="false">
      <input type="text" id="val" value="false" autocomplete="off" spellcheck="false">
      <button id="send">ส่ง</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<footer>บอร์ดว่าง: เปลี่ยน <code>plan.js</code> = เปลี่ยนออฟฟิศ · path ในแผนที่ผูกไว้คือสัญญาที่รับเข้ามา<br>
ดูสัญญา API/MCP ทั้งหมดใน <code>office3d/README.md</code></footer>

<script src="vendor/three.min.js"></script>
<script src="lib/core/bus.js"></script>
<script src="lib/core/kit.js"></script>
<script src="lib/core/motion.js"></script>
<script src="lib/core/board.js"></script>
<script src="lib/core/api.js"></script>
<script src="lib/smarthome/light.js"></script>
<script src="lib/smarthome/meeting.js"></script>
<script src="lib/smarthome/parking.js"></script>
<script src="lib/smarthome/index.js"></script>
<script src="plan.js"></script>
<script src="demo/app.js"></script>
</body>
</html>
